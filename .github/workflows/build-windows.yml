name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared core types
        run: pnpm build:core

      - name: Frontend tests
        run: pnpm --filter @panaderia/desktop test

      - name: Backend (Rust) tests
        run: cargo test
        working-directory: packages/desktop/src-tauri

      - name: Build Tauri bundle (NSIS installer)
        run: pnpm --filter @panaderia/desktop exec tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PanaderiaPOS-windows
          path: packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error